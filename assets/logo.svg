<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2742"/>
      <stop offset="1" stop-color="#1b4a6b"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b134" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e8663a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="960" height="320" rx="28" fill="url(#bg)"/>

  <!-- network: inputs -> hidden -> output, with a new unit being tested -->
  <g stroke="#7fb3d5" stroke-width="2.2" opacity="0.8">
    <line x1="70" y1="105" x2="175" y2="80"/><line x1="70" y1="105" x2="175" y2="160"/>
    <line x1="70" y1="215" x2="175" y2="80"/><line x1="70" y1="215" x2="175" y2="160"/>
    <line x1="175" y1="80" x2="280" y2="160"/><line x1="175" y1="160" x2="280" y2="160"/>
  </g>
  <g stroke="#f2b134" stroke-width="2.6" stroke-dasharray="7 6">
    <line x1="70" y1="105" x2="175" y2="240"/><line x1="70" y1="215" x2="175" y2="240"/>
    <line x1="175" y1="240" x2="280" y2="160"/>
  </g>
  <g fill="#d6eaf8" stroke="#ffffff" stroke-width="2">
    <circle cx="70" cy="105" r="17"/><circle cx="70" cy="215" r="17"/>
    <circle cx="175" cy="80" r="20"/><circle cx="175" cy="160" r="20"/>
    <circle cx="280" cy="160" r="20"/>
  </g>
  <circle cx="175" cy="240" r="21" fill="#0f2742" stroke="#f2b134" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="175" y="249" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f2b134" text-anchor="middle">+</text>

  <!-- bootstrap null distribution with critical value and observed statistic -->
  <g transform="translate(330,60)">
    <path d="M0,170 C30,170 40,40 75,30 C110,22 125,120 165,152 C190,166 215,169 250,170 Z" fill="#7fb3d5" opacity="0.35"/>
    <path d="M165,152 C190,166 215,169 250,170 L165,170 Z" fill="url(#tail)"/>
    <path d="M0,170 C30,170 40,40 75,30 C110,22 125,120 165,152 C190,166 215,169 250,170" fill="none" stroke="#d6eaf8" stroke-width="3"/>
    <line x1="-5" y1="170" x2="262" y2="170" stroke="#d6eaf8" stroke-width="2"/>
    <line x1="165" y1="60" x2="165" y2="170" stroke="#d6eaf8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="165" y="50" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#d6eaf8" text-anchor="middle">c(α)</text>
    <line x1="225" y1="95" x2="225" y2="170" stroke="#f2b134" stroke-width="4"/>
    <circle cx="225" cy="95" r="6" fill="#f2b134"/>
    <text x="225" y="83" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f2b134" text-anchor="middle">Tₙ</text>
  </g>

  <!-- wordmark -->
  <text x="625" y="150" font-family="Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="#ffffff">sup<tspan fill="#f2b134">grow</tspan></text>
  <text x="628" y="192" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#d6eaf8">When should a neural</text>
  <text x="628" y="218" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#d6eaf8">network grow?</text>
  <text x="628" y="256" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7fb3d5">sup-score test · multiplier bootstrap</text>
</svg>
