[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sup-score-growth"
version = "1.1.0"
description = "A sup-score test for deciding when and where a neural network should grow"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mohamad Yamen AL Mohamad"}]
requires-python = ">=3.9"
keywords = ["neural networks", "network growth", "hypothesis testing", "score test",
            "model selection", "bootstrap", "Davies problem", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["torch>=2.0", "numpy", "scipy", "pandas", "matplotlib", "scikit-learn"]

[project.optional-dependencies]
cnn = ["torchvision"]
test = ["pytest"]

[project.scripts]
supgrow-experiments = "supgrow.experiments:main"
supgrow-cnn = "supgrow.cnn_growth:main"

[project.urls]
Homepage = "https://github.com/yamenetoo/sup-score-growth"
Repository = "https://github.com/yamenetoo/sup-score-growth"

[tool.setuptools]
packages = ["supgrow"]
